services:
  edge-api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:////app/data/airport_edge.db
      THERMAL_THRESHOLD_C: ${THERMAL_THRESHOLD_C:-37.5}
      AI_CONFIDENCE_THRESHOLD: ${AI_CONFIDENCE_THRESHOLD:-0.7}
    volumes:
      - edge-data:/app/data
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 10s
  dashboard:
    build:
      context: ./frontend
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:80"
    depends_on:
      edge-api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  edge-data:
